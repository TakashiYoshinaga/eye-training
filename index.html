<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#06080d">
    <title>Eye Training WebXR</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="overlay" class="overlay">
      <section class="panel">
        <p class="kicker">Meta Quest WebXR</p>
        <h1>Eye Training VR</h1>
        <p>
          遠近体操法、遠方凝視法、両眼立体視の考え方をWebXRで試す
          ランドルト環ターゲットゲームです。
        </p>
        <div class="actions">
          <button id="startTraining" type="button">Training Start</button>
          <button id="tutorialMode" type="button">Tutorial</button>
        </div>
        <p class="notice">
          医療効果を保証するものではありません。眼疾患、痛み、めまい、不調がある場合は使用を中止し、専門家に相談してください。
        </p>
      </section>
    </main>
    <div id="hud" class="hud">
      <span id="modeLabel">Tutorial</span>
      <span id="timeLabel">--</span>
      <span id="levelLabel">Lv 1</span>
      <span id="scoreLabel">Score 0</span>
    </div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
